[cache]
enabled = "bool # comment: Cache playlist responses as JSON # liveupdate:true"
cache_dir = "str # comment: Directory used for playlist JSON cache files"
refresh_in_background = "bool # comment: Refresh stale cache entries without delaying the current response # liveupdate:true"
song_ttl_seconds = "int # comment: Seconds before a cached playlist track list is refreshed in the background # liveupdate:true"

[streaming]
enabled = "bool # comment: Enable incremental NDJSON playlist responses # liveupdate:true"

[providers]
default_services = "str # comment: Comma-separated services queried when the request does not specify services # liveupdate:true"
check_spotify_playlists = "bool # comment: Include Spotify when loading playlist collections # liveupdate:true"

[spotify]
load_all_playlists = "bool # comment: Continue loading Spotify playlist pages until all are streamed # liveupdate:true"
request_page_size = "int # comment: Spotify playlists requested per API call, up to 50 # liveupdate:true"
display_batch_size = "int # comment: Playlist cards released to the frontend per streamed batch # liveupdate:true"
display_batch_delay_ms = "int # comment: Delay between frontend playlist batches # liveupdate:true"
max_playlist_pages = "int # comment: Safety limit for Spotify playlist pagination # liveupdate:true"
song_page_size = "int # comment: Spotify tracks fetched per request, up to 100 # liveupdate:true"
song_display_batch_size = "int # comment: Number of songs streamed before applying the display delay # liveupdate:true"
song_display_batch_delay_ms = "int # comment: Small delay between streamed song batches # liveupdate:true"
song_request_delay_ms = "int # comment: Minimum delay between Spotify track page requests to reduce rate-limit pressure # liveupdate:true"
max_song_pages = "int # comment: Safety limit for Spotify track pagination # liveupdate:true"

[pagination]
default_limit = "int # comment: Default number of playlists requested per service # liveupdate:true"
default_offset = "int # comment: Default playlist offset per service # liveupdate:true"
max_limit = "int # comment: Maximum accepted playlist limit per service # liveupdate:true"

[requests]
timeout_seconds = "int # comment: Spotify request timeout in seconds # liveupdate:true"
