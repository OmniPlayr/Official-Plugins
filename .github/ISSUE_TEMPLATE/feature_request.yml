name: Feature request
description: Suggest an improvement to an existing official plugin.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin
      placeholder: "tunnels@built-in"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What would this improve for users?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
